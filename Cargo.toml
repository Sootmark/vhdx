[package]
name = "sootmark-vhdx"
version = "0.1.4"
edition = "2021"
rust-version = "1.80"
description = "Read-only VHDX virtual disks (dynamic and fixed) as a Read + Seek stream, with checksum validation."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/vhdx"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "incident-response"]
# Sources only: test fixtures (disk images, logs, test keys) stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[dependencies]
common = { package = "sootmark-common", version = "0.3.2" }

[dev-dependencies]
disk = { package = "sootmark-disk", version = "0.2.3" }
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
