[package]
name = "vhdx"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Read-only VHDX virtual disks (dynamic and fixed) as a Read + Seek stream, with checksum validation."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/vhdx"
publish = false

[dependencies]
common = { git = "https://github.com/Sootmark/common", tag = "v0.1.0", version = "0.1.0" }

[dev-dependencies]
disk = { git = "https://github.com/Sootmark/disk", tag = "v0.1.0", version = "0.1.0" }
proptest = "1"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
